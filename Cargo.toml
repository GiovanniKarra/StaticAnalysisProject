[package]
name = "static-analysis"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = "0.14.0"
impl_ops = "0.1.1"
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[profile.dev]
debug = "line-tables-only"
lto = "off"

[profile.release]
strip = true
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
